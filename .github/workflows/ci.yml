name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # The full deterministic suite (every src/*.test.mjs). The offline portal
      # smokes are intentionally NOT run here — they need a locally-cached ADO PR
      # fixture (~/.tippani/cache/pr-*.json) that only a live run
      # produces, so they stay a dev-machine step.
      - name: Unit tests
        run: npm test

      # smoke:built-demo builds dist/cli.cjs and boots the REAL bundle, not
      # source. It exists because an esbuild import.meta.url rewrite bug
      # double-booted the demo server inside the bundle while every src/*.test
      # passed — a class of failure that only exists once esbuild has run.
      # Unlike the other smokes, --demo needs no ADO connection or cached PR
      # fixture, so this one CAN run in CI (and should, every push/PR).
      - name: Built-artifact smoke (dist/cli.cjs --demo)
        run: npm run smoke:built-demo

      # Full direct-GitHub portal flow against a local fake GitHub API:
      # boot PR -> render markdown -> post inline comment -> private viewed
      # state -> formal approval. No external network/repository writes.
      - name: GitHub PR portal smoke
        run: npm run smoke:github-pr
