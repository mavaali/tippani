name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # The full deterministic suite (every src/*.test.mjs). The offline portal
      # smokes are intentionally NOT run here — they need a locally-cached ADO PR
      # fixture (~/.tippani/cache/pr-*.json) that only a live/human-like run
      # produces, so they stay a dev-machine step.
      - name: Unit tests
        run: npm test
